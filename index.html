const SERVER = "wss://minecraft-2d-server.saraninastaran9833.workers.dev/room/main";
let ws = null, myId = null, netStatus = "در حال اتصال…";
const others = {};   // بازیکن‌های دیگر؛ کلیدشان id است

// ساخت یا به‌روزرسانی یک بازیکن دیگر (snap: بدون نرم‌کردن، مستقیم بپر به آن نقطه)
function setOther(p, snap) {
  let o = others[p.id];
  if (!o) {
    o = others[p.id] = { x: p.x, y: p.y, w: 18, h: 78, f: 1, wk: 0, amp: 0, sw: 0 };
    snap = true;
  }
  o.name = p.name;
  o.f = p.facing;
  o.tx = p.x;          // مقصدی که سرور گفته
  o.ty = p.y;
  if (snap) { o.x = p.x; o.y = p.y; }
}

function connect() {
  ws = new WebSocket(SERVER + "?name=" + encodeURIComponent(pName));
  ws.onopen = () => {
    netStatus = "متصل";
    console.log("به سرور وصل شد");
    sendPos(performance.now(), true);
  };
  ws.onerror = () => { netStatus = "خطا در اتصال"; };
  ws.onclose = e => {
    netStatus = "قطع شد (کد " + e.code + ")";
    console.log("از سرور قطع شد");
    for (const id in others) delete others[id];
  };
  ws.onmessage = e => {
    let m;
    try { m = JSON.parse(e.data); } catch { return; }

    if (m.type === "welcome") {
      myId = m.player.id;
      m.players.forEach(p => setOther(p, true));
      if (Array.isArray(m.blocks)) m.blocks.forEach(b => remoteBreak(b[0], b[1], b[2]));
    } else if (m.type === "player_joined") {
      setOther(m.player, true);
    } else if (m.type === "player_moved") {
      setOther(m.player, false);
    } else if (m.type === "ev") {
      const o = others[m.id];
      if (m.e === "swing" && o) o.sw = 12;
      else if (m.e === "hurt" && o) { o.dm = 14; if (Math.abs(o.x - P.x) < 700) hurtSound(); }
      else if (m.e === "break") remoteBreak(m.tx, m.j, m.id_);
    } else if (m.type === "player_left") {
      delete others[m.playerId];
    }
    console.log(m.type, "| بازیکن‌های دیگر:", Object.keys(others).length);
  };
}

// رویداد (ضربه، دمیج، شکستن بلوک): فقط وقتی اتفاق می‌افتد فرستاده می‌شود، نه هر فریم
function nev(e, x) {
  if (!ws || ws.readyState !== 1) return;
  const o = Object.assign({ type: "ev", e }, x || {});
  if (o.id !== undefined) { o.id_ = o.id; delete o.id; }   // id بلوک با id بازیکن قاطی نشود
  ws.send(JSON.stringify(o));
}
// شکستن بلوک توسط بازیکن دیگر
function remoteBreak(tx, j, id) {
  if (!(gb(tx, j) > 0)) return;
  const px = tx * T + 20, py = GY + j * T;
  burst(px, py + 20, BC[gb(tx, j)] || '#888', 6);
  setB(tx, j, 0);
  if (id === 10) {
    for (let q = j - 1; gb(tx, q) === 10; q--) { B[tx * JR + q + 1 + JO] = 10; B[tx * JR + q + JO] = 0; }
    if (![0, 1, 2, 3, 4].some(q => gb(tx, -hg[tx] - 1 - q) === 10)) setTimeout(() => growTree(tx), 30000);
  }
}

// فرستادن موقعیت خودمان: حداکثر ۲۰ بار در ثانیه و فقط وقتی چیزی عوض شده
let lastSent = { x: null, y: null, f: null }, lastSendT = 0;
function sendPos(t, force) {
  if (!ws || ws.readyState !== 1) return;
  if (!force && t - lastSendT < 50) return;
  const x = Math.round(P.x), y = Math.round(P.y);
  if (!force && x === lastSent.x && y === lastSent.y && P.f === lastSent.f) return;
  lastSendT = t;
  lastSent = { x, y, f: P.f };
  ws.send(JSON.stringify({ type: "move", x, y, facing: P.f }));
}

// پشتیبان: اگر زبانهٔ مرورگر در پس‌زمینه رفت و بازی ایستاد، باز هم موقعیت فرستاده شود
setInterval(() => sendPos(performance.now()), 100);

// حالت نمایشی بازیکن‌های دیگر: نرم حرکت می‌کنند و از روی تغییر موقعیت حالتشان فهمیده می‌شود
function updOthers(d) {
  for (const id in others) {
    const o = others[id];
    const dx = o.tx - o.x;
    if (Math.abs(dx) > 300) { o.x = o.tx; o.y = o.ty; }   // فاصلهٔ خیلی زیاد: بپر
    const k = Math.min(1, .35 * d);
    o.x += (o.tx - o.x) * k;
    o.y += (o.ty - o.y) * k;
    if (o.sw > 0) o.sw -= d; if (o.dm > 0) o.dm -= d;
    const moving = Math.abs(o.tx - o.x) > .6;                // هنوز در حال رسیدن به مقصد
    const floor = Math.min(gy(o.x + 2), gy(o.x + o.w - 2));
    const grounded = o.y + o.h >= floor - 3;                 // پاها روی زمین است؟
    o.amp += ((moving && grounded ? 1 : 0) - o.amp) * .2;   // در هوا یا ایستاده: پاها ثابت
    o.wk += .25 * d;
  }
}
